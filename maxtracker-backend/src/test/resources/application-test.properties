# Perfil "test": H2 en memoria en modo PostgreSQL. No requiere Supabase ni conexion a internet.
# Flyway aplica los mismos scripts de db/migration y Hibernate valida el esquema contra ellos.
spring.datasource.url=jdbc:h2:mem:maxtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Secreto fijo solo para tests (en produccion viene de JWT_SECRET).
app.jwt.secret=clave-de-prueba-solo-para-tests-maxtracker-0123456789
