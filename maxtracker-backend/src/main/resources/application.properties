spring.application.name=maxtracker-backend
server.port=${PORT:8080}

# En local, lee las variables desde .env (raiz del monorepo o carpeta del backend) si existe.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# --- Base de datos: Supabase PostgreSQL (Session pooler, IPv4) ---
# DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# El plan gratuito de Supabase limita las conexiones: pool pequeno.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate: el esquema lo gestiona Flyway; Hibernate solo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway: scripts SQL versionados en src/main/resources/db/migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- CORS: origenes del frontend separados por coma ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Catalogo de ejercicios (API publica de wger) ---
# En wger el idioma 4 es espanol y el 2 es ingles (respaldo cuando no hay traduccion).
wger.base-url=${WGER_BASE_URL:https://wger.de/api/v2/}
wger.idioma-espanol=${WGER_IDIOMA_ESPANOL:4}
wger.idioma-respaldo=${WGER_IDIOMA_RESPALDO:2}
wger.connect-timeout=5s
wger.read-timeout=10s

# --- Cache en memoria ---
spring.cache.type=simple
spring.cache.cache-names=ejercicios,ejercicio

# --- Errores (RFC 9457 ProblemDetail) ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# --- Actuator: solo health, sin detalles ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
