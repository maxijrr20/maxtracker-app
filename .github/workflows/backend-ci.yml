name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "maxtracker-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "maxtracker-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y testear
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: maxtracker-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: maxtracker-backend/pom.xml

      - name: Compilar y ejecutar tests
        run: ./mvnw -B -ntp verify

      - name: Publicar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: maxtracker-backend/target/surefire-reports/
          retention-days: 7
